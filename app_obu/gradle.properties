org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
android.useAndroidX=true
kotlin.code.style=official
# AGP 9 trae soporte de Kotlin integrado por defecto (requiere migrar al
# nuevo DSL de "built-in Kotlin"); se opta por seguir aplicando el plugin
# clasico org.jetbrains.kotlin.android (soportado explicitamente como
# "opt out" en las notas de version de AGP 9.0) para no acoplar este
# proyecto a un DSL nuevo y en evolucion justo al escribir la Etapa 1.
android.builtInKotlin=false
android.newDsl=false
android.sync.suppressAgpWarnings=UNSUPPORTED_PROJECT_OPTION_USE
