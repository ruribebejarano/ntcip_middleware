# Broker de la campaña 4G en la máquina virtual de Oracle Cloud (Chile
# Central, Santiago): TLS 1.3 + mTLS en 8883, mismas directivas que
# deploy/pki/mosquitto_laptop_tls.conf y scripts/seguridad/mosquitto_tls.conf,
# con las rutas de la máquina (usuario ubuntu, repo en ~/ntcip_middleware).
# Lo arranca deploy/systemd/mosquitto-ntcip.service. El certificado del
# broker (servidor-central) lleva en su SAN la IP pública de la máquina.
# En la máquina, deploy/pki/ solo tiene ca.crt, ca.crl, el certificado del
# servidor y los de las OBU de la campaña: la llave de la CA no sale de la
# laptop.
per_listener_settings false
listener 8883 0.0.0.0
cafile /home/ubuntu/ntcip_middleware/deploy/pki/ca/ca.crt
certfile /home/ubuntu/ntcip_middleware/deploy/pki/servidor/servidor-central.crt
keyfile /home/ubuntu/ntcip_middleware/deploy/pki/servidor/servidor-central.key
tls_version tlsv1.3
require_certificate true
use_identity_as_username true
crlfile /home/ubuntu/ntcip_middleware/deploy/pki/ca/ca.crl
allow_anonymous false
acl_file /home/ubuntu/ntcip_middleware/scripts/seguridad/mosquitto_acl.conf
set_tcp_nodelay true
persistence false
log_dest stdout
