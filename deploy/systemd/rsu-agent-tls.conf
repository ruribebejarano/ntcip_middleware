# Drop-in de rsu-agent.service: conexión MQTT con TLS 1.3 + mTLS al broker
# de la laptop (puerto 8883). Se instala JUNTO a broker.conf (que ya fija
# MQTT_BROKER_HOST=100.121.77.97 y RSU_ID=1, ver docs/ARRANQUE_BROKER_LAPTOP.md),
# no lo reemplaza:
#
#   sudo cp deploy/systemd/rsu-agent-tls.conf /etc/systemd/system/rsu-agent.service.d/tls.conf
#   sudo systemctl daemon-reload && sudo systemctl restart rsu-agent.service
#
# Para volver al broker sin TLS (1883): borrar ese tls.conf, daemon-reload y
# restart. MQTT_BROKER_HOST debe ser un nombre o IP incluido en el SAN del
# certificado del broker (scripts/seguridad/generar_ca.py,
# SAN_SERVIDOR_POR_DEFECTO): el cliente verifica el hostname.
#
# Los tres archivos se copian a ~/rsu-pki/ desde deploy/pki/ de la laptop
# (fuera de git); la clave privada queda con permisos 600.
[Service]
Environment=MQTT_BROKER_PORT=8883
Environment=RSU_TLS_CA=/home/ricardoub/rsu-pki/ca.crt
Environment=RSU_TLS_CERT=/home/ricardoub/rsu-pki/rsu-1.crt
Environment=RSU_TLS_KEY=/home/ricardoub/rsu-pki/rsu-1.key
