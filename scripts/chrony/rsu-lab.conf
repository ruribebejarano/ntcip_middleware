# Fragmento de configuracion de chrony para la RSU (Raspberry Pi) del banco
# de pruebas. Instalar en /etc/chrony/conf.d/rsu-lab.conf (ver
# docs/CONEXION_RASPBERRY.md, seccion de sincronizacion de reloj).
#
# Se fijan explicitamente las mismas referencias NTP publicas que se usan
# para verificar el reloj de la laptop (ver scripts/pi.sh clock), para que
# ambas maquinas midan su offset contra el mismo punto de referencia y el
# desfase entre ellas no incluya una diferencia de referencia ademas de la
# de medicion.

server time.cloudflare.com iburst
server time.google.com iburst

# Permite que `chronyc tracking` reporte un estado util rapido en un banco
# de pruebas que se prende y apaga seguido (no es un servidor de produccion).
makestep 1.0 3
