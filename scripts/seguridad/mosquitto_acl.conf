# ACL de la arquitectura centralizada (P4, sección 1.2 del prompt de
# arquitectura centralizada / sección 1.4 "Seguridad y privacidad").
#
# Requiere, en mosquitto.conf (ver mosquitto_tls.conf en esta carpeta):
#   require_certificate true
#   use_identity_as_username true
# para que el "username" MQTT de cada cliente sea el Common Name (CN) de
# su certificado -- ver scripts/seguridad/generar_ca.py: "servidor-central"
# para el servidor, el RSU_ID tal cual (ej. "1") para cada RSU, y el
# obu_id tal cual para cada OBU -- identidad FIJA por dispositivo (ej.
# "obu-tab-01", item 2b de prompt_integracion_app_obu.md), no por
# sesión/misión.
#
# Probado contra un Mosquitto real el 2026-11-02 (prompt_seguridad.md, S3):
# tests/test_seguridad_broker.py T06-T09 confirman que esta ACL bloquea
# una OBU publicando en el tema de solicitudes de una RSU, una OBU
# publicando/suscribiéndose a los temas de otra OBU, y una RSU
# suscribiéndose al tema de otra RSU. T10 confirma, y documenta, la
# limitación conocida de la regla `pattern write servidor/central/respuestas`
# (sin %c/%u: cualquier cliente autenticado puede publicar ahí) y que el
# impacto es bajo porque servidor/gestor_mision.py::procesar_m2 ignora
# cualquier id_solicitud fuera de seguimiento. Pendiente: probarlo contra
# el Mosquitto de la Raspberry Pi real (sigue sin tocarse en esta sesión).

# --- Servidor central: el ÚNICO publicador autorizado en rsu/+/solicitudes ---
# (el requisito central de la sección 1.2: "ACL del broker: solo la
# identidad del servidor puede publicar en rsu/+/solicitudes").
user servidor-central
topic write rsu/+/solicitudes
topic read obu/+/mision
topic read obu/+/posicion
topic write obu/+/ruta
topic write obu/+/estado
topic readwrite servidor/central/respuestas

# --- Cada RSU: solo su propio tema de solicitudes (lectura/suscripción), ---
# --- y el tema de respuestas del servidor para enviar M2 (Response Topic ---
# --- de MQTT 5 que trae el propio M1/M3, no un tema fijo por RSU) ---
# "pattern" (a diferencia de "topic") se evalúa para CUALQUIER usuario
# autenticado, sustituyendo %u por su propio username -- una RSU con
# username "1" solo obtiene acceso a "rsu/1/solicitudes", nunca a
# "rsu/2/solicitudes" de otra RSU.
pattern read rsu/%u/solicitudes

# [REVISAR con asesor] limitación conocida: esta línea también le da a
# cualquier OBU autenticada permiso de ESCRIBIR en el tema de respuestas
# del servidor (podría publicar un M2 falso). El impacto real es bajo
# porque servidor/gestor_mision.py::procesar_m2 ignora cualquier
# "id_solicitud" que no esté en seguimiento (ver _solicitud_a_parada), pero
# sigue siendo una violación de "solo la RSU que originó la solicitud
# responde" en el sentido estricto de la ACL. Separar esto con precisión
# requeriría que mosquitto distinga el ROL del cliente (RSU vs OBU), no
# solo su identidad individual -- mosquitto_dynamic_security o un plugin
# serían la forma correcta; no se implementó aquí por alcance.
pattern write servidor/central/respuestas

# --- Cada OBU: solo sus propios temas (obu_id = %u, el CN del certificado) ---
# (sección 1.2: "Cada OBU solo puede publicar en sus propios
# obu/{obu_id}/mision y obu/{obu_id}/posicion, y solo leer sus propios
# ruta y estado").
pattern write obu/%u/mision
pattern write obu/%u/posicion
pattern read obu/%u/ruta
pattern read obu/%u/estado
