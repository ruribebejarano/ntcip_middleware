# Mosquitto con TLS 1.3 + mTLS + ACL para la arquitectura centralizada (P4).
#
# *** NO PROBADO CONTRA UN MOSQUITTO REAL EN ESTE ENTORNO *** -- no hay un
# broker corriendo aquí para verificarlo en vivo. generar_ca.py sí se
# probó end-to-end (init/emitir/revocar/listar, con `openssl verify` real).
# Antes de este archivo, el banco de pruebas corría con
# `allow_anonymous true` y sin cifrar (ver README.md, "Fuera de alcance por
# ahora") -- este archivo es el que hay que probar para dejar eso atrás.
#
# Para probarlo (Raspberry Pi, o laptop con Mosquitto instalado):
#   1. python scripts/seguridad/generar_ca.py init
#   2. python scripts/seguridad/generar_ca.py emitir --tipo servidor
#   3. python scripts/seguridad/generar_ca.py emitir --tipo rsu --id 1
#      (repetir por cada RSU_ID real, y --tipo obu --id <obu_id> por cada OBU)
#   4. mosquitto -c scripts/seguridad/mosquitto_tls.conf -v
#   5. Probar el rechazo de un cliente SIN certificado (debe fallar el
#      handshake TLS):
#        mosquitto_pub -h <host> -p 8883 -t rsu/1/solicitudes -m '{}'
#   6. Probar que una OBU no puede publicar en rsu/+/solicitudes aunque
#      tenga un certificado válido (debe conectar pero el PUBLISH debe
#      fallar silenciosamente, o el broker debe desconectar según la
#      versión):
#        mosquitto_pub --cafile deploy/pki/ca/ca.crt \
#          --cert deploy/pki/obu/<id>/obu-<id>.crt --key deploy/pki/obu/<id>/obu-<id>.key \
#          -h <host> -p 8883 -t rsu/1/solicitudes -m '{}'
#
# TLS 1.3 explícito: tls_version se fija a tlsv1.3 a propósito (sección 1.4,
# "TLS 1.3 en todos los enlaces"), no al valor por defecto de Mosquitto
# (que acepta 1.2 también). [REVISAR con asesor] si algún cliente real
# (p. ej. una librería MQTT embebida de la app Android) no soporta 1.3
# todavía -- en ese caso habría que relajar esto a tlsv1.2 documentando la
# excepción.

listener 8883
cafile /etc/mosquitto/pki/ca.crt
certfile /etc/mosquitto/pki/servidor-central.crt
keyfile /etc/mosquitto/pki/servidor-central.key
# Ruta real en este repo (copiar a /etc/mosquitto/pki/ al desplegar, o
# ajustar estas tres rutas si se corre el broker desde el propio repo):
#   deploy/pki/ca/ca.crt
#   deploy/pki/servidor/servidor-central.crt
#   deploy/pki/servidor/servidor-central.key
tls_version tlsv1.3
require_certificate true
use_identity_as_username true
# Descomentar una vez que exista deploy/pki/ca/ca.crl (scripts/seguridad/generar_ca.py revocar):
# crlfile /etc/mosquitto/pki/ca.crl

allow_anonymous false
acl_file /etc/mosquitto/acl/mosquitto_acl.conf
# Ruta real en este repo: scripts/seguridad/mosquitto_acl.conf

persistence false
log_dest stdout
